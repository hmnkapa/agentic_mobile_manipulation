[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manipulation-agentic-system"
version = "0.2.0"
description = "An auditable agent harness for OmniGibson manipulation research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==1.28.1"]
navigation = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.scripts]
manip-agent = "manipulation_agent.vision_cli:main"
manip-mcp = "manipulation_agent.mcp_server:main"
manip-sft = "manipulation_agent.sft.cli:main"
manip-train = "manipulation_agent.training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
manipulation_agent = ["tasks.json", "replay_assets/*.html", "replay_assets/*.css", "replay_assets/*.js", "report_assets/*.css", "report_assets/*.js"]

[tool.setuptools.data-files]
"share/manipulation-agentic-system/training" = ["configs/training/qwen35_4b_lora.toml", "configs/training/qwen35_4b_lora_img256.toml", "configs/training/qwen35_4b_lora_img64.toml", "configs/training/qwen35_4b_lora_img64_compact.toml", "configs/training/smoke.toml"]
"share/manipulation-agentic-system/training/launch" = ["configs/training/launch/single_gpu.toml", "configs/training/launch/ddp_2gpu.toml"]
"share/manipulation-agentic-system/skills/visual-manipulation" = ["skills/visual-manipulation/SKILL.md"]
"share/manipulation-agentic-system/skills/visual-manipulation/references" = ["skills/visual-manipulation/references/evidence.md", "skills/visual-manipulation/references/material-actions.md"]
"share/manipulation-agentic-system/skills/visual-exploration" = ["skills/visual-exploration/SKILL.md"]
"share/manipulation-agentic-system/skills/pick-and-place" = ["skills/pick-and-place/SKILL.md"]
"share/manipulation-agentic-system/skills/failure-recovery" = ["skills/failure-recovery/SKILL.md"]
"share/manipulation-agentic-system/skills/goal-decomposition" = ["skills/goal-decomposition/SKILL.md"]
"share/manipulation-agentic-system/skills/goal-decomposition/references" = ["skills/goal-decomposition/references/working-state.md"]

[tool.pytest.ini_options]
markers = [
  "qwen_encode: explicit real Qwen processor encoding checks",
  "gpu: explicit real GPU LoRA train/resume/export checks",
]
